; 改訂版 Japanese.ini の値を、キー（節と番号）ごとに上書きする補正。
; scripts/gen-i18n.mjs が「Japanese.ini → このファイル」の順に重ねて ini.generated.ts を作る。
; Japanese.ini はユーザーが用意した改訂版の写しなので書き換えず、直したい値はここに書く。
